[package]
name = "crystalchess"
version = "0.1.0"
description = "CrystalChess — glassmorphic desktop chess"
authors = ["CrystalChess Team"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# `_lib` suffix avoids a name clash with the bin target on Windows (cargo#8519).
name = "crystalchess_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-window-state = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Same major as Tauri's internal copy, so only one build is linked.
window-vibrancy = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
